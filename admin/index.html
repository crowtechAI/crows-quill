<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Crow's Quill — Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<style>
  :root {
    --ink: #0e0c15;
    --ink-soft: #1a1628;
    --ink-soft2: #221d33;
    --wine: #5c2438;
    --wine-bright: #842f4c;
    --bronze: #b08a4e;
    --bronze-bright: #c9a05f;
    --parchment: #f4efe6;
    --lilac: #cdc4d9;
    --lilac-dim: #8d859b;
    --line: rgba(205, 196, 217, 0.12);
    --line-gold: rgba(201, 160, 95, 0.22);
    --ok: #6e8f6b;
    --warn: #c9a05f;
    --err: #d98fa0;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--ink); color:var(--lilac); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Cormorant Garamond',serif; color:var(--parchment); font-weight:600; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:18px 28px; border-bottom:1px solid var(--line); background:rgba(14,12,21,0.9); }
  .brand { font-family:'Cormorant Garamond',serif; font-size:21px; color:var(--parchment); font-weight:600; }
  .brand em { color:var(--bronze-bright); font-style:italic; }
  #signOutBtn { background:transparent; border:1px solid var(--line); color:var(--lilac-dim); padding:8px 16px; border-radius:4px; font-size:13px; cursor:pointer; transition:all 0.2s; }
  #signOutBtn:hover { border-color:var(--bronze-bright); color:var(--parchment); }

  .auth-wrap { max-width:360px; margin:100px auto; padding:0 24px; }
  .auth-wrap h2 { margin-bottom:8px; }
  .auth-wrap p.sub { color:var(--lilac-dim); font-size:14px; margin-bottom:24px; }
  .field { margin-bottom:14px; }
  label { font-size:12.5px; color:var(--lilac-dim); display:block; margin-bottom:5px; }
  input, select, textarea { width:100%; background:var(--ink-soft); border:1px solid var(--line); border-radius:4px; padding:10px 12px; color:var(--lilac); font-family:'Inter'; font-size:14px; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--bronze); outline-offset:1px; }
  :focus-visible { outline:2px solid var(--bronze-bright); outline-offset:2px; border-radius:4px; }
  .btn { background:var(--bronze); color:var(--ink); font-weight:600; border:none; padding:11px 20px; min-height:44px; border-radius:4px; font-size:14px; cursor:pointer; transition:background .15s; }
  .btn:hover { background:var(--bronze-bright); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn-ghost { background:transparent; border:1px solid var(--line); color:var(--lilac); padding:11px 18px; min-height:44px; border-radius:4px; font-size:14px; cursor:pointer; transition:border-color .15s, color .15s; }
  .btn-ghost:hover { border-color:var(--bronze-bright); color:var(--parchment); }
  .btn-ghost:disabled { opacity:.45; cursor:not-allowed; }
  .link-btn { background:none; border:none; color:var(--bronze-bright); font-size:13px; cursor:pointer; padding:0; margin-top:14px; min-height:44px; }
  .auth-err { color:var(--err); font-size:13px; margin-top:10px; display:none; }

  .layout { display:flex; min-height:calc(100vh - 61px); }
  .sidebar { width:200px; border-right:1px solid var(--line); padding:22px 12px; flex-shrink:0; }
  .sidebar .tab { display:block; width:100%; min-height:44px; text-align:left; background:none; border:none; color:var(--lilac-dim); font-size:14px; padding:12px; border-radius:4px; cursor:pointer; margin-bottom:2px; transition:background .15s, color .15s; }
  .sidebar .tab:hover { background:var(--ink-soft2); color:var(--parchment); }
  .sidebar .tab.active { background:var(--ink-soft2); color:#f2eee6; }
  .sidebar .tab .count { float:right; color:var(--lilac-dim); font-size:12px; }

  .main { flex:1; padding:26px 30px; overflow-y:auto; }
  .list-row { display:grid; grid-template-columns:1.4fr 1fr 0.8fr 0.8fr 0.6fr; gap:14px; align-items:center; padding:14px 16px; border:1px solid var(--line); border-radius:6px; margin-bottom:10px; cursor:pointer; background:var(--ink-soft); transition:border-color .15s; }
  .list-row:hover { border-color:var(--bronze); }
  .list-row .name { color:#f2eee6; font-size:15px; }
  .list-row .sub { color:var(--lilac-dim); font-size:12.5px; margin-top:2px; }
  .badge { display:inline-block; padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:600; text-transform:capitalize; }
  .badge.enquiry { background:rgba(148,141,163,0.2); color:var(--lilac-dim); }
  .badge.quoted { background:rgba(201,160,95,0.18); color:var(--bronze-bright); }
  .badge.accepted { background:rgba(110,143,107,0.18); color:var(--ok); }
  .badge.in_progress { background:rgba(92,36,56,0.35); color:#e8a8bb; }
  .badge.delivered { background:rgba(110,143,107,0.3); color:#8fc78a; }
  .badge.declined, .badge.cancelled { background:rgba(193,127,143,0.15); color:var(--err); }
  .empty { color:var(--lilac-dim); font-size:14px; padding:40px 0; text-align:center; }

  /* ---------- Slide-out panel ---------- */
  .overlay { position:fixed; inset:0; background:rgba(8,6,14,.66); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); display:none; align-items:flex-start; justify-content:flex-end; z-index:100; }
  .overlay.show { display:flex; }
  .panel { position:relative; width:min(500px, 100vw); height:100vh; background:linear-gradient(180deg, var(--ink-soft), var(--ink)); border-left:1px solid var(--line-gold); box-shadow:-24px 0 60px rgba(0,0,0,.55); padding:32px 28px 56px; overflow-y:auto; animation:panelIn .22s ease-out; }
  @keyframes panelIn { from { transform:translateX(28px); opacity:0; } to { transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .panel { animation:none; } }
  .panel h2 { font-size:30px; line-height:1.1; margin-bottom:4px; padding-right:48px; }
  .panel .panel-email { color:var(--lilac-dim); font-size:13px; word-break:break-all; }
  .panel .panel-head { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .panel .close { position:absolute; top:18px; right:18px; background:none; border:none; color:var(--lilac-dim); font-size:22px; cursor:pointer; width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:50%; transition:background .15s, color .15s; }
  .panel .close:hover { background:var(--ink-soft2); color:var(--parchment); }
  .list-row:focus-visible { outline:2px solid var(--bronze-bright); outline-offset:2px; }
  .sidebar .tab:focus-visible { outline:2px solid var(--bronze-bright); outline-offset:-2px; }
  .panel-section { margin-top:16px; padding:18px; background:rgba(255,255,255,.02); border:1px solid var(--line); border-radius:8px; }
  .panel-section h3 { font-family:'Cinzel',serif; font-size:11.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--bronze-bright); margin-bottom:12px; }
  .kv { display:flex; justify-content:space-between; gap:16px; font-size:13.5px; padding:9px 0; border-bottom:1px solid var(--line); color:var(--lilac); }
  .kv:last-of-type { border-bottom:none; }
  .kv span:first-child { color:var(--lilac-dim); flex-shrink:0; }
  .kv span:last-child { color:var(--parchment); text-align:right; }
  .brief-text { font-size:13.5px; line-height:1.6; color:var(--lilac); background:var(--ink); border:1px solid var(--line); padding:12px 14px; border-radius:6px; margin-top:10px; white-space:pre-wrap; word-break:break-word; }
  .file-row { display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:8px 0; border-bottom:1px solid var(--line); word-break:break-all; }
  .file-row:last-child { border-bottom:none; }
  .status-row { display:flex; gap:10px; margin-top:12px; }
  .status-row .btn, .status-row .btn-ghost { flex:1; }
  .chk-row { display:flex; align-items:center; gap:10px; font-size:13.5px; margin-top:12px; }
  .chk-row input[type=checkbox] { width:18px; height:18px; flex-shrink:0; accent-color:var(--bronze); }
  .chk-row label { margin:0; color:var(--lilac); font-size:13.5px; }
  #sendPaymentLinkBtn { border-color:var(--line-gold); color:var(--bronze-bright); }
  #sendPaymentLinkBtn:hover:not(:disabled) { background:rgba(201,160,95,.1); color:var(--parchment); }
  #saveStatus { width:100%; margin-top:6px; }
  .panel-msg { font-size:13px; line-height:1.5; margin-top:10px; padding:10px 12px; border-radius:6px; border:1px solid var(--line); display:none; word-break:break-word; }
  .panel-msg.ok { display:block; color:#9fc79b; background:rgba(110,143,107,.12); border-color:rgba(110,143,107,.3); }
  .panel-msg.warn { display:block; color:var(--bronze-bright); background:rgba(201,160,95,.1); border-color:var(--line-gold); }
  .panel-msg.err { display:block; color:var(--err); background:rgba(217,143,160,.1); border-color:rgba(217,143,160,.3); }
  .panel-msg .copy-row { display:flex; gap:8px; margin-top:8px; }
  .panel-msg .copy-row input { font-size:12px; padding:8px 10px; }
  .panel-msg .copy-row button { flex-shrink:0; min-height:0; padding:8px 14px; }
  .link-status { color:var(--lilac-dim); font-size:12.5px; margin-top:10px; }
  .loading-msg { color:var(--lilac-dim); padding:30px 0; }
  @media (max-width:600px) { .panel { padding:26px 16px 48px; } .panel-section { padding:16px 14px; } }
</style>
</head>
<body>

<div id="authView" style="display:none;">
  <div class="topbar"><div class="brand">The Crow's <em>Quill</em> Studio</div></div>
  <div class="auth-wrap">
    <h2>Sign in</h2>
    <p class="sub" id="authSub">Studio access for The Crow's Quill.</p>
    <div class="field"><label for="authEmail">Email</label><input type="email" id="authEmail"></div>
    <div class="field"><label for="authPass">Password</label><input type="password" id="authPass"></div>
    <button class="btn" id="authSubmit" style="width:100%;">Sign in</button>
    <p class="auth-err" id="authErr"></p>
  </div>
</div>

<div id="appView" style="display:none;">
  <div class="topbar">
    <div class="brand">The Crow's <em>Quill</em> Studio</div>
    <button id="signOutBtn">Sign out</button>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebarTabs"></div>
    <div class="main">
      <div id="listWrap"><p class="loading-msg">Loading commissions…</p></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

<script>
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
let allCommissions = [];
let activeTab = 'all';

const TABS = [
  { key:'all', label:'All' },
  { key:'enquiry', label:'Enquiries' },
  { key:'quoted', label:'Quoted' },
  { key:'accepted', label:'Accepted' },
  { key:'in_progress', label:'In progress' },
  { key:'delivered', label:'Delivered' },
  { key:'declined', label:'Declined / cancelled' },
];

// Client-supplied text (names, briefs, notes) is rendered via innerHTML, so escape it.
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
}

// ---------- Auth ----------
document.getElementById('authSubmit').addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPass').value;
  const errEl = document.getElementById('authErr');
  errEl.style.display = 'none';
  errEl.style.color = 'var(--err)';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
});

document.getElementById('signOutBtn').addEventListener('click', () => sb.auth.signOut());

sb.auth.onAuthStateChange((_event, session) => {
  if (session) {
    document.getElementById('authView').style.display = 'none';
    document.getElementById('appView').style.display = 'block';
    renderSidebar();
    loadCommissions();
  } else {
    document.getElementById('authView').style.display = 'block';
    document.getElementById('appView').style.display = 'none';
  }
});

// ---------- Sidebar ----------
function renderSidebar() {
  const wrap = document.getElementById('sidebarTabs');
  wrap.innerHTML = '';
  TABS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (t.key === activeTab ? ' active' : '');
    btn.innerHTML = `${t.label} <span class="count" id="count-${t.key}"></span>`;
    btn.addEventListener('click', () => { activeTab = t.key; renderSidebar(); updateCounts(); renderList(); });
    wrap.appendChild(btn);
  });
}

// ---------- Load & list ----------
async function loadCommissions() {
  const { data, error } = await sb
    .from('commissions')
    .select('*, client:clients(*), slot:slots(*), quotes(*), contracts(*), commission_files(*), commission_notes(*)')
    .order('created_at', { ascending: false });
  if (error) { document.getElementById('listWrap').innerHTML = '<p class="empty">Could not load commissions.</p>'; console.error(error); return; }
  allCommissions = data || [];
  updateCounts();
  renderList();
}

function updateCounts() {
  TABS.forEach(t => {
    const el = document.getElementById('count-' + t.key);
    if (!el) return;
    const n = t.key === 'all' ? allCommissions.length
      : t.key === 'declined' ? allCommissions.filter(c => c.status === 'declined' || c.status === 'cancelled').length
      : allCommissions.filter(c => c.status === t.key).length;
    el.textContent = n;
  });
}

function renderList() {
  const wrap = document.getElementById('listWrap');
  let items = allCommissions;
  if (activeTab === 'declined') items = items.filter(c => c.status === 'declined' || c.status === 'cancelled');
  else if (activeTab !== 'all') items = items.filter(c => c.status === activeTab);

  if (!items.length) { wrap.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }

  wrap.innerHTML = '';
  items.forEach(c => {
    const row = document.createElement('div');
    row.className = 'list-row';
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    const name = c.client?.name || 'Unknown';
    row.setAttribute('aria-label', `Open commission for ${name}, status ${c.status.replace('_',' ')}`);
    const slotDate = c.slot ? new Date(c.slot.slot_date).toLocaleDateString('en-GB', { day:'numeric', month:'short' }) : '—';
    row.innerHTML = `
      <div><div class="name">${esc(name)}</div><div class="sub">${esc(c.client?.book_title || '')}</div></div>
      <div class="sub">${esc(labelFromType(c.commission_type))}</div>
      <div class="sub">${slotDate}</div>
      <div class="sub">£${esc(c.total_price ?? '—')}</div>
      <div><span class="badge ${esc(c.status)}">${esc(c.status.replace('_',' '))}</span></div>
    `;
    row.addEventListener('click', () => openPanel(c));
    row.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPanel(c); }
    });
    wrap.appendChild(row);
  });
}

function labelFromType(id) {
  const map = { portrait1:'Portrait — 1 char', half1:'Half body — 1 char', full1:'Full body — 1 char',
    portrait2:'Portrait — 2 char', half2:'Half body — 2 char', full2:'Full body — 2 char',
    scenebasic1:'Scene, basic — 1 char', scenedetail1:'Scene, detailed — 1 char',
    scenebasic2:'Scene, basic — 2 char', scenedetail2:'Scene, detailed — 2 char' };
  return map[id] || id;
}

function paymentBtnLabel(c) {
  if (c.balance_paid) return 'Fully paid';
  const kind = c.deposit_paid ? 'balance' : 'deposit';
  return `${c.deposit_link_sent_at && !c.deposit_paid ? 'Resend' : 'Send'} ${kind} link`;
}

// ---------- Detail panel ----------
function openPanel(c) {
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const quote = c.quotes?.[0];
  const contract = c.contracts?.[0];
  const slotDate = c.slot ? new Date(c.slot.slot_date).toLocaleDateString('en-GB', { day:'numeric', month:'long' }) : '—';

  panel.innerHTML = `
    <button class="close" id="closePanel" aria-label="Close panel">×</button>
    <h2>${esc(c.client?.name || 'Unknown')}</h2>
    <div class="panel-email">${esc(c.client?.email || '')}</div>
    <div class="panel-head"><span class="badge ${esc(c.status)}">${esc(c.status.replace('_',' '))}</span></div>

    <div class="panel-section">
      <h3>Commission</h3>
      <div class="kv"><span>Type</span><span>${esc(labelFromType(c.commission_type))}</span></div>
      <div class="kv"><span>Book / series</span><span>${esc(c.client?.book_title || '—')}</span></div>
      <div class="kv"><span>Slot</span><span>${slotDate}</span></div>
      <div class="kv"><span>Total</span><span>£${esc(c.total_price ?? '—')}</span></div>
      <div class="kv"><span>Deposit</span><span>£${esc(c.deposit_amount ?? '—')}</span></div>
      ${c.brief ? `<div class="brief-text">${esc(c.brief)}</div>` : ''}
    </div>

    <div class="panel-section">
      <h3>Status &amp; payment</h3>
      <select id="statusSelect" aria-label="Status">
        ${['enquiry','quoted','accepted','declined','in_progress','delivered','cancelled'].map(s =>
          `<option value="${s}" ${s === c.status ? 'selected' : ''}>${s.replace('_',' ')}</option>`).join('')}
      </select>
      <div class="chk-row"><input type="checkbox" id="depositChk" ${c.deposit_paid ? 'checked' : ''}><label for="depositChk">Deposit paid</label></div>
      <div class="chk-row"><input type="checkbox" id="balanceChk" ${c.balance_paid ? 'checked' : ''}><label for="balanceChk">Balance paid</label></div>
      <div class="status-row">
        <button class="btn-ghost" id="sendPaymentLinkBtn" ${c.balance_paid ? 'disabled' : ''}>${paymentBtnLabel(c)}</button>
      </div>
      ${c.deposit_link_sent_at && !c.deposit_paid ? `<div class="link-status">Link sent ${new Date(c.deposit_link_sent_at).toLocaleString('en-GB')} — awaiting payment.</div>` : ''}
      <div class="panel-msg" id="paymentLinkMsg" role="status" aria-live="polite"></div>
      <div class="status-row"><button class="btn" id="saveStatus">Save changes</button></div>
    </div>

    ${quote ? `
    <div class="panel-section">
      <h3>Quote</h3>
      <div class="kv"><span>Response</span><span>${esc(quote.response)}</span></div>
      <div class="kv"><span>Sent</span><span>${new Date(quote.sent_at).toLocaleDateString('en-GB')}</span></div>
    </div>` : ''}

    ${contract ? `
    <div class="panel-section">
      <h3>Contract</h3>
      <div class="kv"><span>Signed by</span><span>${esc(contract.signature_name)}</span></div>
      <div class="kv"><span>Signed on</span><span>${new Date(contract.signed_at).toLocaleDateString('en-GB')}</span></div>
    </div>` : ''}

    <div class="panel-section">
      <h3>Client notes</h3>
      <div id="noteList">
        ${(c.commission_notes || []).map(n => `<div class="brief-text">${esc(n.note)}<div style="color:var(--lilac-dim);font-size:11.5px;margin-top:6px;">${new Date(n.created_at).toLocaleString('en-GB')} — ${esc(n.created_by)}</div></div>`).join('') || '<p class="link-status" style="margin-top:0;">No notes yet.</p>'}
      </div>
    </div>

    <div class="panel-section">
      <h3>Files</h3>
      <div id="fileList">
        ${(c.commission_files || []).map(f => `<div class="file-row"><span>${esc(f.file_path.split('/').pop())} <span style="color:var(--lilac-dim);">(${esc(f.file_type)})</span></span></div>`).join('') || '<p class="link-status" style="margin-top:0;">No files yet.</p>'}
      </div>
      <div style="margin-top:14px;">
        <label for="uploadType">Add a file</label>
        <select id="uploadType" style="margin-bottom:8px;">
          <option value="reference">Reference</option>
          <option value="sketch">Sketch</option>
          <option value="final_delivery">Final delivery</option>
          <option value="other">Other</option>
        </select>
        <input type="file" id="uploadInput">
        <button class="btn-ghost" id="uploadBtn" style="margin-top:8px;">Upload</button>
      </div>
    </div>
  `;

  document.getElementById('closePanel').addEventListener('click', () => overlay.classList.remove('show'));
  overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('show'); };

  document.getElementById('sendPaymentLinkBtn').addEventListener('click', async () => {
    const btn = document.getElementById('sendPaymentLinkBtn');
    const msg = document.getElementById('paymentLinkMsg');
    const label = paymentBtnLabel(c);
    btn.disabled = true; btn.textContent = 'Sending…';
    msg.className = 'panel-msg'; msg.innerHTML = '';

    const showErr = (text) => {
      msg.className = 'panel-msg err';
      msg.textContent = `Could not send the link — ${text}`;
      btn.disabled = false; btn.textContent = label;
    };

    const { data, error } = await sb.functions.invoke('send-payment-link', { body: { commission_id: c.id } });
    if (error) {
      console.error(error);
      let detail = error.message;
      try { const body = await error.context.json(); if (body?.error) detail = body.error; } catch (_) {}
      showErr(detail);
      return;
    }
    if (data?.error) { showErr(data.error); return; }

    if (data?.emailed) {
      msg.className = 'panel-msg ok';
      msg.textContent = 'Payment link emailed to the client.';
    } else {
      // Link was created but the email didn't go out — let the artist copy it.
      msg.className = 'panel-msg warn';
      msg.innerHTML = `Link created but not emailed${data?.emailError ? ' (' + esc(data.emailError) + ')' : ''}. Copy it and send it yourself:
        <div class="copy-row"><input type="text" readonly id="payLinkUrl" value="${esc(data?.url || '')}"><button class="btn-ghost" id="copyPayLink">Copy</button></div>`;
      document.getElementById('copyPayLink').addEventListener('click', async (e) => {
        try { await navigator.clipboard.writeText(data.url); e.target.textContent = 'Copied'; }
        catch (_) { document.getElementById('payLinkUrl').select(); }
      });
    }
    btn.disabled = false;
    btn.textContent = c.deposit_paid ? 'Resend balance link' : 'Resend deposit link';
    loadCommissions();
  });

  document.getElementById('saveStatus').addEventListener('click', async () => {
    const btn = document.getElementById('saveStatus');
    btn.disabled = true; btn.textContent = 'Saving…';
    const { error } = await sb.from('commissions').update({
      status: document.getElementById('statusSelect').value,
      deposit_paid: document.getElementById('depositChk').checked,
      balance_paid: document.getElementById('balanceChk').checked,
      updated_at: new Date().toISOString()
    }).eq('id', c.id);
    btn.disabled = false; btn.textContent = 'Save changes';
    if (!error) { overlay.classList.remove('show'); loadCommissions(); }
  });

  document.getElementById('uploadBtn').addEventListener('click', async () => {
    const input = document.getElementById('uploadInput');
    if (!input.files.length) return;
    const file = input.files[0];
    const fileType = document.getElementById('uploadType').value;
    const path = `${c.id}/${Date.now()}-${file.name}`;
    const btn = document.getElementById('uploadBtn');
    btn.disabled = true; btn.textContent = 'Uploading…';
    const { error: upErr } = await sb.storage.from('commission-files').upload(path, file);
    if (upErr) { console.error(upErr); btn.disabled = false; btn.textContent = 'Upload'; return; }
    await sb.from('commission_files').insert({ commission_id: c.id, file_path: path, file_type: fileType, uploaded_by: 'artist' });
    openPanel({ ...c, commission_files: [...(c.commission_files || []), { file_path: path, file_type: fileType }] });
    loadCommissions();
  });

  overlay.classList.add('show');
}

// initial check
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) {
    document.getElementById('appView').style.display = 'block';
    renderSidebar();
    loadCommissions();
  } else {
    document.getElementById('authView').style.display = 'block';
  }
});
</script>
</body>
</html>
