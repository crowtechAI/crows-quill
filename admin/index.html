<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Crow's Quill — Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script src="/admin/social.js" defer></script>
<style>
  :root {
    --ink: #0e0c15;
    --ink-soft: #1a1628;
    --ink-soft2: #221d33;
    --wine: #5c2438;
    --wine-bright: #842f4c;
    --bronze: #b08a4e;
    --bronze-bright: #c9a05f;
    --parchment: #f4efe6;
    --lilac: #cdc4d9;
    --lilac-dim: #8d859b;
    --line: rgba(205, 196, 217, 0.12);
    --line-gold: rgba(201, 160, 95, 0.22);
    --ok: #6e8f6b;
    --warn: #c9a05f;
    --err: #d98fa0;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--ink); color:var(--lilac); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Cormorant Garamond',serif; color:var(--parchment); font-weight:600; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:18px 28px; border-bottom:1px solid var(--line); background:rgba(14,12,21,0.9); }
  .brand { display:flex; align-items:center; gap:10px; font-family:'Cormorant Garamond',serif; font-size:15px; color:var(--parchment); font-weight:600; letter-spacing:0.04em; text-transform:uppercase; }
  .brand img { height:34px; width:auto; display:block; filter: drop-shadow(0 0 10px rgba(201, 160, 95, 0.18)); }
  #signOutBtn { background:transparent; border:1px solid var(--line); color:var(--lilac-dim); padding:8px 16px; border-radius:4px; font-size:13px; cursor:pointer; transition:all 0.2s; }
  #signOutBtn:hover { border-color:var(--bronze-bright); color:var(--parchment); }

  .auth-wrap { max-width:360px; margin:100px auto; padding:0 24px; }
  .auth-wrap h2 { margin-bottom:8px; }
  .auth-wrap p.sub { color:var(--lilac-dim); font-size:14px; margin-bottom:24px; }
  .field { margin-bottom:14px; }
  label { font-size:12.5px; color:var(--lilac-dim); display:block; margin-bottom:5px; }
  input, select, textarea { width:100%; background:var(--ink-soft); border:1px solid var(--line); border-radius:4px; padding:10px 12px; color:var(--lilac); font-family:'Inter'; font-size:14px; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--bronze); outline-offset:1px; }
  :focus-visible { outline:2px solid var(--bronze-bright); outline-offset:2px; border-radius:4px; }
  .btn { background:var(--bronze); color:var(--ink); font-weight:600; border:none; padding:11px 20px; min-height:44px; border-radius:4px; font-size:14px; cursor:pointer; transition:background .15s; }
  .btn:hover { background:var(--bronze-bright); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn-ghost { background:transparent; border:1px solid var(--line); color:var(--lilac); padding:11px 18px; min-height:44px; border-radius:4px; font-size:14px; cursor:pointer; transition:border-color .15s, color .15s; }
  .btn-ghost:hover { border-color:var(--bronze-bright); color:var(--parchment); }
  .link-btn { background:none; border:none; color:var(--bronze-bright); font-size:13px; cursor:pointer; padding:0; margin-top:14px; min-height:44px; }
  .auth-err { color:var(--err); font-size:13px; margin-top:10px; display:none; }

  .layout { display:flex; min-height:calc(100vh - 61px); }
  .sidebar { width:200px; border-right:1px solid var(--line); padding:22px 12px; flex-shrink:0; }
  .sidebar .tab { display:block; width:100%; min-height:44px; text-align:left; background:none; border:none; color:var(--lilac-dim); font-size:14px; padding:12px; border-radius:4px; cursor:pointer; margin-bottom:2px; transition:background .15s, color .15s; }
  .sidebar .tab:hover { background:var(--ink-soft2); color:var(--parchment); }
  .sidebar .tab.active { background:var(--ink-soft2); color:#f2eee6; }
  .sidebar .tab .count { float:right; color:var(--lilac-dim); font-size:12px; }

  .main { flex:1; padding:26px 30px; overflow-y:auto; }
  .list-row { display:grid; grid-template-columns:1.4fr 1fr 0.8fr 0.8fr 0.6fr; gap:14px; align-items:center; padding:14px 16px; border:1px solid var(--line); border-radius:6px; margin-bottom:10px; cursor:pointer; background:var(--ink-soft); transition:border-color .15s; }
  .list-row:hover { border-color:var(--bronze); }
  .list-row .name { color:#f2eee6; font-size:15px; }
  .list-row .sub { color:var(--lilac-dim); font-size:12.5px; margin-top:2px; }
  .badge { display:inline-block; padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:600; text-transform:capitalize; }
  .badge.enquiry { background:rgba(148,141,163,0.2); color:var(--lilac-dim); }
  .badge.quoted { background:rgba(201,160,95,0.18); color:var(--bronze-bright); }
  .badge.accepted { background:rgba(110,143,107,0.18); color:var(--ok); }
  .badge.in_progress { background:rgba(92,36,56,0.35); color:#e8a8bb; }
  .badge.delivered { background:rgba(110,143,107,0.3); color:#8fc78a; }
  .badge.declined, .badge.cancelled { background:rgba(193,127,143,0.15); color:var(--err); }
  .empty { color:var(--lilac-dim); font-size:14px; padding:40px 0; text-align:center; }

  /* ---- Booking slide-out panel ---- */
  .overlay { position:fixed; inset:0; background:rgba(8,6,14,.62); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); display:flex; justify-content:flex-end; z-index:100; opacity:0; visibility:hidden; transition:opacity .25s ease, visibility 0s linear .25s; }
  .overlay.show { opacity:1; visibility:visible; transition:opacity .25s ease; }
  .panel { position:relative; width:min(520px, 100vw); height:100vh; height:100dvh; background:linear-gradient(180deg, #1c182b 0%, #171323 100%); border-left:1px solid var(--line-gold); box-shadow:-24px 0 60px rgba(0,0,0,.45); display:flex; flex-direction:column; transform:translateX(40px); transition:transform .32s cubic-bezier(.22,1,.36,1); }
  .overlay.show .panel { transform:none; }
  @media (prefers-reduced-motion: reduce) { .overlay, .panel { transition:none; } }

  .panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:24px 26px 18px; border-bottom:1px solid var(--line); background:rgba(14,12,21,.35); }
  .panel-head h2 { font-size:26px; line-height:1.15; margin:0 0 3px; word-break:break-word; }
  .panel-email { color:var(--lilac-dim); font-size:13px; word-break:break-all; }
  .panel-pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .pill { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600; border:1px solid var(--line); color:var(--lilac-dim); background:rgba(148,141,163,.08); }
  .pill.ok { color:#8fc78a; border-color:rgba(110,143,107,.4); background:rgba(110,143,107,.14); }
  .pill.warn { color:var(--bronze-bright); border-color:var(--line-gold); background:rgba(201,160,95,.1); }
  .panel .close { flex-shrink:0; background:rgba(255,255,255,.03); border:1px solid var(--line); color:var(--lilac-dim); font-size:22px; line-height:1; cursor:pointer; width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:50%; transition:background .15s, color .15s, border-color .15s; }
  .panel .close:hover { background:var(--ink-soft2); color:var(--parchment); border-color:var(--bronze); }
  .list-row:focus-visible { outline:2px solid var(--bronze-bright); outline-offset:2px; }
  .sidebar .tab:focus-visible { outline:2px solid var(--bronze-bright); outline-offset:-2px; }

  .panel-body { flex:1; overflow-y:auto; padding:20px 26px 28px; overscroll-behavior:contain; }
  .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .summary .tile { background:var(--ink); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .summary .tile .k { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--lilac-dim); margin-bottom:5px; }
  .summary .tile .v { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; color:var(--parchment); line-height:1.1; }
  .summary .tile.accent { border-color:var(--line-gold); }
  .summary .tile.accent .v { color:var(--bronze-bright); }

  .panel-section { background:rgba(14,12,21,.45); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-top:14px; }
  .panel-section h3 { font-family:'Inter',sans-serif; font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; font-weight:600; color:var(--bronze-bright); margin-bottom:10px; }
  .kv { display:flex; justify-content:space-between; gap:16px; font-size:13.5px; padding:7px 0; color:var(--parchment); border-bottom:1px solid rgba(205,196,217,.06); }
  .kv:last-of-type { border-bottom:none; }
  .kv span:first-child { color:var(--lilac-dim); flex-shrink:0; }
  .kv span:last-child { text-align:right; word-break:break-word; }
  .brief-text { font-size:13.5px; line-height:1.55; color:var(--lilac); background:var(--ink); border:1px solid var(--line); padding:12px 14px; border-radius:8px; margin-top:10px; white-space:pre-wrap; word-break:break-word; }
  .meta { color:var(--lilac-dim); font-size:11.5px; margin-top:8px; }
  .note-item { margin-top:8px; }
  .muted { color:var(--lilac-dim); font-size:13px; }

  .toggle-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; margin-top:8px; background:var(--ink); border:1px solid var(--line); border-radius:8px; cursor:pointer; font-size:13.5px; color:var(--parchment); }
  .toggle-row:hover { border-color:var(--line-gold); }
  .toggle-row input { position:absolute; opacity:0; width:0; height:0; }
  .toggle-row .sw { position:relative; flex-shrink:0; width:38px; height:22px; border-radius:11px; background:#2c2640; border:1px solid var(--line); transition:background .2s, border-color .2s; }
  .toggle-row .sw::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--lilac-dim); transition:transform .2s, background .2s; }
  .toggle-row input:checked + .sw { background:rgba(110,143,107,.35); border-color:rgba(110,143,107,.6); }
  .toggle-row input:checked + .sw::after { transform:translateX(16px); background:#8fc78a; }
  .toggle-row input:focus-visible + .sw { outline:2px solid var(--bronze-bright); outline-offset:2px; }
  .field-label { display:block; font-size:12px; color:var(--lilac-dim); margin:0 0 6px; }
  .panel-actions { margin-top:14px; }
  .panel-actions .btn-ghost { width:100%; }
  .link-box { display:none; margin-top:10px; background:var(--ink); border:1px solid var(--line-gold); border-radius:8px; padding:10px; }
  .link-box.show { display:block; }
  .link-box .row { display:flex; gap:8px; }
  .link-box input { font-size:12px; }
  .link-box .btn-ghost { min-height:40px; padding:8px 14px; white-space:nowrap; }
  .msg { font-size:13px; line-height:1.5; margin-top:10px; padding:10px 12px; border-radius:8px; display:none; }
  .msg.show { display:block; }
  .msg.err { color:var(--err); background:rgba(217,143,160,.08); border:1px solid rgba(217,143,160,.25); }
  .msg.ok { color:#8fc78a; background:rgba(110,143,107,.1); border:1px solid rgba(110,143,107,.3); }
  .file-row { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13px; padding:9px 0; border-bottom:1px solid rgba(205,196,217,.06); color:var(--parchment); word-break:break-all; }
  .file-row .ft { flex-shrink:0; font-size:11px; color:var(--lilac-dim); border:1px solid var(--line); padding:2px 8px; border-radius:20px; }
  .upload-box { margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); }

  .panel-foot { padding:14px 26px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:#15111f; display:flex; gap:10px; }
  .panel-foot .btn { flex:1; }
  .loading-msg { color:var(--lilac-dim); padding:30px 0; }
  @media (max-width:560px) { .panel-head, .panel-body, .panel-foot { padding-left:18px; padding-right:18px; } .summary { grid-template-columns:1fr 1fr; } .summary .tile:last-child { grid-column:1 / -1; } }

  /* ---- Availability calendar ---- */
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .cal-head h2 { font-size:20px; }
  .cal-nav { display:flex; gap:8px; align-items:center; }
  .cal-nav button { background:var(--ink-soft); border:1px solid var(--line); color:var(--lilac); width:36px; height:36px; border-radius:4px; cursor:pointer; font-size:16px; }
  .cal-nav button:hover { border-color:var(--bronze); color:var(--parchment); }
  .cal-legend { display:flex; gap:16px; font-size:12px; color:var(--lilac-dim); margin-bottom:14px; }
  .cal-legend span { display:inline-flex; align-items:center; gap:6px; }
  .cal-dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .cal-dot.open { background:var(--ok); }
  .cal-dot.full { background:var(--warn); }
  .cal-dot.closed { background:var(--lilac-dim); }
  .cal-dot.unset { background:transparent; border:1px solid var(--line); }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-dow { text-align:center; font-size:11.5px; color:var(--lilac-dim); padding-bottom:6px; text-transform:uppercase; letter-spacing:.04em; }
  .cal-day { position:relative; border:1px solid var(--line); border-radius:6px; min-height:74px; padding:8px; cursor:pointer; background:var(--ink-soft); transition:border-color .12s, background .12s; user-select:none; }
  .cal-day.blank { visibility:hidden; cursor:default; }
  .cal-day:hover { border-color:var(--bronze); }
  .cal-day.past { opacity:.35; cursor:not-allowed; }
  .cal-day .num { font-size:13px; color:var(--lilac); }
  .cal-day .status-line { font-size:10.5px; margin-top:20px; display:flex; align-items:center; gap:5px; }
  .cal-day.open { background:rgba(110,143,107,0.14); border-color:rgba(110,143,107,0.3); }
  .cal-day.full { background:rgba(201,160,95,0.12); border-color:rgba(201,160,95,0.3); }
  .cal-day.closed { background:rgba(141,133,155,0.08); }
  .cal-day.in-range { outline:2px solid var(--bronze-bright); outline-offset:-2px; }
  .cal-settings-panel { background:var(--ink-soft2); border:1px solid var(--line-gold); border-radius:8px; padding:16px 18px; margin-bottom:20px; }
  .cal-settings-head { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .cal-settings-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; margin-top:14px; }
  .cal-setting-item label { font-size:13px; font-weight:600; color:var(--parchment); display:block; margin-bottom:4px; }
  .cal-setting-item .desc { font-size:11.5px; color:var(--lilac-dim); margin-bottom:8px; line-height:1.4; }
  .cal-setting-item .field-row { display:flex; align-items:center; gap:8px; }
  .cal-setting-item input[type=number] { width:80px; padding:8px 10px; background:var(--ink-surface); border:1px solid var(--line-gold); border-radius:4px; color:var(--parchment); font-weight:600; }
  .cal-workflow-guide { margin-top:14px; padding:12px 14px; background:var(--ink); border:1px solid var(--line); border-radius:6px; font-size:12.5px; line-height:1.55; }
  .cal-actionbar { display:none; align-items:center; gap:12px; background:var(--ink-soft2); border:1px solid var(--line-gold); border-radius:6px; padding:14px 16px; margin-top:16px; flex-wrap:wrap; }
  .cal-actionbar.show { display:flex; }

  /* ---------- Clients (resource centre) ---------- */
  .side-divider { height:1px; background:var(--line); margin:10px 6px; }
  .client-row { grid-template-columns:1.5fr 1.1fr 0.5fr 0.7fr 0.9fr; }
  .badge.published { background:rgba(110,143,107,0.3); color:#8fc78a; }
  .badge.requested { background:rgba(201,160,95,0.18); color:var(--bronze-bright); }
  .badge.hidden, .badge.notasked { background:rgba(148,141,163,0.2); color:var(--lilac-dim); }
  .panel.wide { width:min(720px, 100vw); }
  .panel a { color:var(--bronze-bright); }
  .mini-card { padding:14px 16px; margin-top:10px; background:var(--ink); border:1px solid var(--line); border-radius:6px; }
  .mini-card .mc-title { color:var(--parchment); font-size:14.5px; }
  .mini-card .mc-sub { color:var(--lilac-dim); font-size:12.5px; margin-top:2px; }
  .mini-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .mini-actions .btn, .mini-actions .btn-ghost { min-height:38px; padding:8px 14px; font-size:13px; }
  .t-stars { color:var(--bronze-bright); letter-spacing:2px; font-size:15px; }
  .t-quote { font-style:italic; color:var(--lilac); font-size:13.5px; line-height:1.6; margin-top:8px; white-space:pre-wrap; word-break:break-word; }
  .note-meta { color:var(--lilac-dim); font-size:11.5px; margin-top:6px; }
  .file-row .btn-ghost { min-height:34px; padding:6px 12px; font-size:12.5px; flex-shrink:0; margin-left:10px; }
  .setup-hint { font-size:12.5px; color:var(--bronze-bright); background:rgba(201,160,95,.1); border:1px solid var(--line-gold); padding:10px 12px; border-radius:6px; margin-bottom:14px; }
  @media (max-width:760px) { .client-row { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>

<div id="authView" style="display:none;">
  <div class="topbar"><div class="brand"><img src="/images/crows-quill-logo.png" alt="The Crow's Quill" width="391" height="300"><span>Studio</span></div></div>
  <div class="auth-wrap">
    <h2>Sign in</h2>
    <p class="sub" id="authSub">Studio access for The Crow's Quill.</p>
    <div class="field"><label for="authEmail">Email</label><input type="email" id="authEmail"></div>
    <div class="field"><label for="authPass">Password</label><input type="password" id="authPass"></div>
    <button class="btn" id="authSubmit" style="width:100%;">Sign in</button>
    <p class="auth-err" id="authErr"></p>
  </div>
</div>

<div id="appView" style="display:none;">
  <div class="topbar">
    <div class="brand"><img src="/images/crows-quill-logo.png" alt="The Crow's Quill" width="391" height="300"><span>Studio</span></div>
    <button id="signOutBtn">Sign out</button>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebarTabs"></div>
    <div class="main">
      <div id="listWrap"><p class="loading-msg">Loading commissions…</p></div>
      <div id="calendarWrap" style="display:none;"></div>
      <div id="portfolioWrap" style="display:none;"></div>
      <div id="socialWrap" style="display:none;"></div>
      <div id="visitorsWrap" style="display:none;"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

<script>
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
let allCommissions = [];
let activeTab = 'all';
let testimonialsReady = true;
let activeView = 'commissions'; // 'commissions' | 'calendar'

const TABS = [
  { key:'all', label:'All' },
  { key:'enquiry', label:'Enquiries' },
  { key:'quoted', label:'Quoted' },
  { key:'accepted', label:'Accepted' },
  { key:'in_progress', label:'In progress' },
  { key:'delivered', label:'Delivered' },
  { key:'declined', label:'Declined / cancelled' },
  { key:'clients', label:'Clients', divider:true },
];

// ---------- Auth ----------
document.getElementById('authSubmit').addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPass').value;
  const errEl = document.getElementById('authErr');
  errEl.style.display = 'none';
  errEl.style.color = 'var(--err)';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
});

document.getElementById('signOutBtn').addEventListener('click', () => sb.auth.signOut());

sb.auth.onAuthStateChange((_event, session) => {
  if (session) {
    document.getElementById('authView').style.display = 'none';
    document.getElementById('appView').style.display = 'block';
    renderSidebar();
    loadCommissions();
  } else {
    document.getElementById('authView').style.display = 'block';
    document.getElementById('appView').style.display = 'none';
  }
});

// ---------- Sidebar ----------
function renderSidebar() {
  const wrap = document.getElementById('sidebarTabs');
  wrap.innerHTML = '';

  const calBtn = document.createElement('button');
  calBtn.className = 'tab' + (activeView === 'calendar' ? ' active' : '');
  calBtn.textContent = 'Calendar';
  calBtn.addEventListener('click', () => { activeView = 'calendar'; renderSidebar(); showView('calendar'); });
  wrap.appendChild(calBtn);

  const pfBtn = document.createElement('button');
  pfBtn.className = 'tab' + (activeView === 'portfolio' ? ' active' : '');
  pfBtn.textContent = 'Portfolio';
  pfBtn.addEventListener('click', () => { activeView = 'portfolio'; renderSidebar(); showView('portfolio'); });
  wrap.appendChild(pfBtn);

  const socBtn = document.createElement('button');
  socBtn.className = 'tab' + (activeView === 'social' ? ' active' : '');
  socBtn.textContent = 'Social posts';
  socBtn.addEventListener('click', () => { activeView = 'social'; renderSidebar(); showView('social'); });
  wrap.appendChild(socBtn);

  const visBtn = document.createElement('button');
  visBtn.className = 'tab' + (activeView === 'visitors' ? ' active' : '');
  visBtn.textContent = 'Visitors';
  visBtn.addEventListener('click', () => { activeView = 'visitors'; renderSidebar(); showView('visitors'); });
  wrap.appendChild(visBtn);

  const divider = document.createElement('div');
  divider.style.cssText = 'height:1px;background:var(--line);margin:10px 4px 12px;';
  wrap.appendChild(divider);

  TABS.forEach(t => {
    if (t.divider) { const d = document.createElement('div'); d.className = 'side-divider'; wrap.appendChild(d); }
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeView === 'commissions' && t.key === activeTab ? ' active' : '');
    btn.innerHTML = `${t.label} <span class="count" id="count-${t.key}"></span>`;
    btn.addEventListener('click', () => { activeView = 'commissions'; activeTab = t.key; renderSidebar(); showView('commissions'); renderList(); });
    wrap.appendChild(btn);
  });
}

function showView(view) {
  document.getElementById('listWrap').style.display = view === 'commissions' ? 'block' : 'none';
  document.getElementById('calendarWrap').style.display = view === 'calendar' ? 'block' : 'none';
  document.getElementById('portfolioWrap').style.display = view === 'portfolio' ? 'block' : 'none';
  document.getElementById('socialWrap').style.display = view === 'social' ? 'block' : 'none';
  document.getElementById('visitorsWrap').style.display = view === 'visitors' ? 'block' : 'none';
  if (view === 'visitors') renderVisitors();
  if (view === 'social' && window.renderSocialStudio) window.renderSocialStudio();
  if (view === 'portfolio') renderPortfolioAdmin();
  if (view === 'calendar' && !calendarLoadedOnce) { calendarLoadedOnce = true; renderCalendar(); }
}

// ---------- Visitors (cookie-less page-view counter) ----------
const VIS_LABELS = { '/': 'Home page', '/site/': 'Booking form', '/privacy/': 'Privacy policy', '/terms/': 'Terms of service' };
async function renderVisitors() {
  const wrap = document.getElementById('visitorsWrap');
  wrap.innerHTML = '<p class="loading-msg">Loading visitor stats…</p>';
  const since = new Date(Date.now() - 29 * 864e5).toISOString().slice(0, 10);
  const { data, error } = await sb.from('page_views').select('day, path, visits').gte('day', since).order('day');
  if (error) { wrap.innerHTML = '<p class="empty">Could not load visitor stats.</p>'; console.error(error); return; }
  const rows = data || [];
  const iso = d => d.toISOString().slice(0, 10);
  const today = iso(new Date());
  const last7 = iso(new Date(Date.now() - 6 * 864e5));
  const sum = f => rows.filter(f).reduce((n, r) => n + r.visits, 0);
  const home = r => r.path === '/';
  const perDay = {};
  rows.filter(home).forEach(r => { perDay[r.day] = (perDay[r.day] || 0) + r.visits; });
  const days = Array.from({ length: 30 }, (_, i) => iso(new Date(Date.now() - (29 - i) * 864e5)));
  const max = Math.max(1, ...days.map(d => perDay[d] || 0));
  const byPath = {};
  rows.forEach(r => { byPath[r.path] = (byPath[r.path] || 0) + r.visits; });
  const top = Object.entries(byPath).sort((a, b) => b[1] - a[1]).slice(0, 8);

  wrap.innerHTML = `
    <div class="summary" style="grid-template-columns:repeat(3,1fr);">
      <div class="tile accent"><div class="k">Home page visits today</div><div class="v">${sum(r => home(r) && r.day === today)}</div></div>
      <div class="tile"><div class="k">Last 7 days</div><div class="v">${sum(r => home(r) && r.day >= last7)}</div></div>
      <div class="tile"><div class="k">Last 30 days</div><div class="v">${sum(home)}</div></div>
    </div>
    <div class="panel-section" style="margin-top:0;">
      <h3>Home page visits — last 30 days</h3>
      <div style="display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:8px;" role="img" aria-label="Daily home page visits for the last 30 days">
        ${days.map(d => `<div title="${d}: ${perDay[d] || 0}" style="flex:1;min-width:4px;height:${Math.max(3, Math.round((perDay[d] || 0) / max * 100))}%;background:${perDay[d] ? 'var(--bronze-bright)' : 'var(--line)'};border-radius:2px 2px 0 0;"></div>`).join('')}
      </div>
      <div class="meta" style="display:flex;justify-content:space-between;"><span>${days[0]}</span><span>${days[29]}</span></div>
    </div>
    <div class="panel-section">
      <h3>Most viewed pages</h3>
      ${top.length ? top.map(([p, n]) => `<div class="kv"><span>${esc(VIS_LABELS[p] || p)}</span><span>${n}</span></div>`).join('') : '<p class="meta" style="margin:0;">No visits recorded yet — counts start from the first visit after this feature went live.</p>'}
    </div>
    <p class="meta">A visit is counted once per browser session per page. Bots are filtered out and your own visits while signed in here aren't counted. No cookies, IP addresses or personal data are stored, so this shows visits, not unique people.</p>`;
}

const PF_SECTIONS = { gallery: 'Selected work', commissions: 'Commissions' };
let pfItems = [];

async function renderPortfolioAdmin() {

    <div class="pf-row" data-id="${esc(it.id)}" style="border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px;display:grid;grid-template-columns:120px 1fr;gap:16px;">

      <div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div class="field"><label class="field-label">Card label</label><input data-f="label" value="${esc(it.label)}"></div>
          <div class="field"><label class="field-label">Section</label><select data-f="section">${secOpts(it.section)}</select></div>
          <div class="field"><label class="field-label">Made for (author / client)</label><input data-f="client_name" value="${esc(it.client_name || '')}" placeholder="e.g. L. Ann"></div>
          <div class="field"><label class="field-label">Link (https://…)</label><input data-f="link_url" value="${esc(it.link_url || '')}" placeholder="Book page or author site"></div>
          <div class="field"><label class="field-label">Order (lower shows first)</label><input data-f="sort_order" type="number" value="${esc(it.sort_order)}"></div>
          <div class="field"><label class="field-label">Image focus (CSS, e.g. center 30%)</label><input data-f="image_position" value="${esc(it.image_position || 'center')}"></div>
        </div>
        <div class="field"><label class="field-label">Image description (for screen readers)</label><input data-f="alt_text" value="${esc(it.alt_text || '')}"></div>
        <div class="field"><label class="field-label">Replace image</label><input type="file" accept="image/*" data-f="file"></div>
        <label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--lilac);margin-bottom:12px;"><input type="checkbox" data-f="published" style="width:auto;"${it.published ? ' checked' : ''}> Show on homepage</label>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
          <button class="btn" data-act="save">Save</button>
          <button class="btn-ghost" data-act="delete">Delete</button>
          <span class="pf-msg" style="font-size:13px;color:var(--lilac-dim);"></span>
        </div>
      </div>
    </div>`;
  wrap.innerHTML = `
    <h2 style="margin:0 0 6px;">Portfolio</h2>
    <p style="color:var(--lilac-dim);font-size:14px;margin:0 0 18px;">Cards shown on the homepage. Add who the work was for and a link. Prices are not shown on these cards. Uploaded images are not watermarked automatically.</p>
    <div style="border:1px dashed var(--line);border-radius:6px;padding:14px;margin-bottom:22px;">
      <strong style="font-size:14px;">Add a piece</strong>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;" id="pfNew">
        <div class="field"><label class="field-label">Card label</label><input data-n="label" value="Character Portrait"></div>
        <div class="field"><label class="field-label">Section</label><select data-n="section">${secOpts('gallery')}</select></div>
        <div class="field"><label class="field-label">Made for (author / client)</label><input data-n="client_name"></div>
        <div class="field"><label class="field-label">Link (https://…)</label><input data-n="link_url"></div>
        <div class="field" style="grid-column:1/-1;"><label class="field-label">Image description (for screen readers)</label><input data-n="alt_text"></div>
        <div class="field" style="grid-column:1/-1;"><label class="field-label">Image</label><input type="file" accept="image/*" data-n="file"></div>
      </div>
      <button class="btn" id="pfAdd">Add to homepage</button> <span id="pfAddMsg" style="font-size:13px;color:var(--lilac-dim);margin-left:8px;"></span>
    </div>
    ${pfItems.length ? pfItems.map(rowHtml).join('') : '<p class="empty">No pieces yet.</p>'}`;

  const cleanLink = v => { v = (v || '').trim(); if (!v) return null; if (!/^https?:\/\//i.test(v)) v = 'https://' + v; return v; };
  const upload = async file => {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
    const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error: upErr } = await sb.storage.from('portfolio').upload(path, file, { contentType: file.type, upsert: false });
    if (upErr) throw upErr;
    return sb.storage.from('portfolio').getPublicUrl(path).data.publicUrl;
  };

  document.getElementById('pfAdd').addEventListener('click', async () => {
    const q = n => document.querySelector(`#pfNew [data-n="${n}"]`);
    const msg = document.getElementById('pfAddMsg');
    const file = q('file').files[0];
    if (!file) { msg.textContent = 'Choose an image first.'; return; }
    msg.textContent = 'Uploading…';
    try {
      const image_url = await upload(file);
      const maxOrder = pfItems.reduce((m, i) => Math.max(m, i.sort_order || 0), 0);
      const { error: insErr } = await sb.from('portfolio_items').insert({
        label: q('label').value.trim() || 'Character Portrait', section: q('section').value,
        client_name: q('client_name').value.trim() || null, link_url: cleanLink(q('link_url').value),
        alt_text: q('alt_text').value.trim(), image_url, sort_order: maxOrder + 10
      });
      if (insErr) throw insErr;
      renderPortfolioAdmin();
    } catch (e) { console.error(e); msg.textContent = 'Could not add: ' + (e.message || 'error'); }
  });

  wrap.querySelectorAll('.pf-row').forEach(row => {
    const id = row.dataset.id;
    const f = n => row.querySelector(`[data-f="${n}"]`);
    const msg = row.querySelector('.pf-msg');
    row.querySelector('[data-act="save"]').addEventListener('click', async () => {
      msg.textContent = 'Saving…';
      try {
        const patch = {
          label: f('label').value.trim() || 'Character Portrait', section: f('section').value,
          client_name: f('client_name').value.trim() || null, link_url: cleanLink(f('link_url').value),
          sort_order: parseInt(f('sort_order').value, 10) || 0, image_position: f('image_position').value.trim() || 'center',
          alt_text: f('alt_text').value.trim(), published: f('published').checked, updated_at: new Date().toISOString()
        };
        const file = f('file').files[0];
        if (file) patch.image_url = await upload(file);
        const { error: upErr } = await sb.from('portfolio_items').update(patch).eq('id', id);
        if (upErr) throw upErr;
        msg.textContent = 'Saved.';
        if (file) renderPortfolioAdmin();
      } catch (e) { console.error(e); msg.textContent = 'Could not save: ' + (e.message || 'error'); }
    });
    row.querySelector('[data-act="delete"]').addEventListener('click', async () => {
      if (!confirm('Remove this piece from the homepage?')) return;
      const { error: delErr } = await sb.from('portfolio_items').delete().eq('id', id);
      if (delErr) { msg.textContent = 'Could not delete: ' + delErr.message; return; }
      renderPortfolioAdmin();
    });
  });
}

// ---------- Load & list ----------
async function loadCommissions() {
  const BASE = '*, client:clients(*), slot:slots(*), quotes(*), contracts(*), commission_files(*), commission_notes(*)';
  let { data, error } = await sb.from('commissions').select(BASE + ', testimonials(*)').order('created_at', { ascending: false });
  testimonialsReady = !error;
  if (error) {
    // Testimonials migration not run yet: keep the dashboard working without it.
    console.warn('Loading without testimonials:', error.message);
    ({ data, error } = await sb.from('commissions').select(BASE).order('created_at', { ascending: false }));
  }
  if (error) { document.getElementById('listWrap').innerHTML = '<p class="empty">Could not load commissions.</p>'; console.error(error); return; }
  allCommissions = data || [];
  updateCounts();
  renderList();
}

function updateCounts() {
  TABS.forEach(t => {
    const el = document.getElementById('count-' + t.key);
    if (!el) return;
    const n = t.key === 'clients' ? getClientGroups().length
      : t.key === 'all' ? allCommissions.length
      : t.key === 'declined' ? allCommissions.filter(c => c.status === 'declined' || c.status === 'cancelled').length
      : allCommissions.filter(c => c.status === t.key).length;
    el.textContent = n;
  });
}

function renderList() {
  const wrap = document.getElementById('listWrap');
  if (activeTab === 'clients') { renderClients(wrap); return; }
  let items = allCommissions;
  if (activeTab === 'declined') items = items.filter(c => c.status === 'declined' || c.status === 'cancelled');
  else if (activeTab !== 'all') items = items.filter(c => c.status === activeTab);

  if (!items.length) { wrap.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }

  wrap.innerHTML = '';
  items.forEach(c => {
    const row = document.createElement('div');
    row.className = 'list-row';
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    const name = c.client?.name || 'Unknown';
    row.setAttribute('aria-label', `Open commission for ${name}, status ${c.status.replace('_',' ')}`);
    const slotDate = c.slot ? new Date(c.slot.slot_date).toLocaleDateString('en-GB', { day:'numeric', month:'short' }) : '—';
    row.innerHTML = `
      <div>
        <div class="name">${name}</div>
        <div class="sub">${c.client?.book_title || ''}</div>
        <div style="font-family:monospace;font-size:11px;color:var(--bronze-bright);margin-top:2px;">REF: ${c.id.slice(0,8)}</div>
      </div>
      <div class="sub">${labelFromType(c.commission_type)}</div>
      <div class="sub">${slotDate}</div>
      <div class="sub">$${c.total_price ?? '—'}</div>
      <div><span class="badge ${c.status}">${c.status.replace('_',' ')}</span></div>
    `;
    row.addEventListener('click', () => openPanel(c));
    row.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPanel(c); }
    });
    wrap.appendChild(row);
  });
}

const esc = v => String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

  const map = { portrait1:'Portrait — 1 char', half1:'Half body — 1 char', full1:'Full body — 1 char',

    scenebasic1:'Scene, basic — 1 char', scenedetail1:'Scene, detailed — 1 char',

  return map[id] || id;
}

let calYear, calMonth; // calMonth is 0-indexed
let slotsByDate = {}; // 'YYYY-MM-DD' -> slot row

let leadTimeWeeks = 6; // studio_settings.lead_time_weeks

(function initCalDate() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
})();

function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function loadSlotsForMonth(year, month) {
  const first = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  const [{ data, error }, { data: cfg }] = await Promise.all([
    sb.rpc('get_slot_availability', { p_from: isoDate(first), p_to: isoDate(last) }),
    sb.from('studio_settings').select('monthly_capacity, lead_time_weeks').maybeSingle()
  ]);
  if (error) { console.error(error); return; }
  if (cfg) {
    if (cfg.monthly_capacity != null) monthlyCapacity = cfg.monthly_capacity;
    if (cfg.lead_time_weeks != null) leadTimeWeeks = cfg.lead_time_weeks;
  }
  slotsByDate = {};
  (data || []).forEach(s => {
    // Monthly cap decides fullness: an open date in a full month shows as Full.
    const display = (s.status === 'blocked' || s.status === 'closed') ? 'closed'
      : (s.remaining <= 0 ? 'full' : 'open');
    slotsByDate[s.slot_date] = { id: s.slot_id, slot_date: s.slot_date, status: display, remaining: s.remaining };
  });
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  clearSelection();
  renderCalendar();
}

function clearSelection() { selRange = { start: null, end: null }; }

function onDayClick(iso) {
  if (!selRange.start || (selRange.start && selRange.end)) {
    selRange = { start: iso, end: iso };
  } else {
    // second click: set range in correct order
    if (iso < selRange.start) selRange = { start: iso, end: selRange.start };
    else selRange = { start: selRange.start, end: iso };
  }
  refreshSelectionUI();
}

function refreshSelectionUI() {
  const bar = document.getElementById('calActionBar');
  document.querySelectorAll('.cal-day[data-date]').forEach(el => {
    const iso = el.getAttribute('data-date');
    const inRange = selRange.start && iso >= selRange.start && iso <= (selRange.end || selRange.start);
    el.classList.toggle('in-range', !!inRange);
  });
  if (selRange.start) {
    bar.classList.add('show');
    const label = selRange.start === selRange.end
      ? new Date(selRange.start).toLocaleDateString('en-GB', { day:'numeric', month:'short' })
      : `${new Date(selRange.start).toLocaleDateString('en-GB', { day:'numeric', month:'short' })} – ${new Date(selRange.end).toLocaleDateString('en-GB', { day:'numeric', month:'short' })}`;
    document.getElementById('calSelLabel').textContent = label;
  } else {
    bar.classList.remove('show');
  }
}

async function applyToSelection(action) {
  if (!selRange.start) return;
  const dates = [];
  let cur = new Date(selRange.start);
  const end = new Date(selRange.end);
  while (cur <= end) { dates.push(isoDate(cur)); cur.setDate(cur.getDate() + 1); }

  const btn = action === 'open' ? document.getElementById('calApplyOpen') : document.getElementById('calApplyClosed');
  btn.disabled = true; const origText = btn.textContent; btn.textContent = 'Saving…';

  for (const iso of dates) {
    const existing = slotsByDate[iso];
    if (action === 'open') {
      if (existing) {
        await sb.from('slots').update({ status: 'open' }).eq('id', existing.id);
      } else {
        await sb.from('slots').insert({ slot_date: iso, status: 'open' });
      }
    } else {
      if (existing) {
        await sb.from('slots').update({ status: 'closed' }).eq('id', existing.id);
      }
      // no row + closed = already not accepting, nothing to do
    }
  }

  btn.disabled = false; btn.textContent = origText;
  clearSelection();
  renderCalendar();
}

// ---------- Clients (resource centre) ----------
// A "client" appears here once at least one of their commissions is approved
// (accepted / in progress / delivered) AND their deposit has been paid.
const PAID_STATUSES = ['accepted', 'in_progress', 'delivered'];
function isPaidApproved(c) { return !!c.deposit_paid && PAID_STATUSES.includes(c.status); }
function testimonialOf(c) { const t = c.testimonials; return Array.isArray(t) ? (t[0] || null) : (t || null); }

function getClientGroups() {
  const map = new Map();
  allCommissions.filter(isPaidApproved).forEach(c => {
    const id = c.client?.id || c.client_id;
    if (!map.has(id)) map.set(id, { id, client: c.client, commissions: [] });
    map.get(id).commissions.push(c);
  });
  return [...map.values()];
}

function groupTestimonialState(g) {
  const ts = g.commissions.map(testimonialOf).filter(Boolean);
  if (ts.some(t => t.status === 'published')) return 'published';
  if (ts.some(t => t.status === 'requested')) return 'requested';
  if (ts.some(t => t.status === 'hidden')) return 'hidden';
  return 'notasked';
}
const T_LABELS = { published:'Testimonial live', requested:'Requested', hidden:'Hidden', notasked:'Not asked' };

function renderClients(wrap) {
  const groups = getClientGroups();
  if (!groups.length) {
    wrap.innerHTML = '<p class="empty">No clients yet. A client appears here as soon as a commission is approved.</p>';
    return;
  }
  wrap.innerHTML = '';
  groups.forEach(g => {
    const cl = g.client || {};
    const total = g.commissions.reduce((n, c) => n + (Number(c.total_price) || 0), 0);
    const st = groupTestimonialState(g);
    const row = document.createElement('div');
    row.className = 'list-row client-row';
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    row.setAttribute('aria-label', `Open client resource centre for ${cl.name || 'Unknown'}`);
    row.innerHTML = `
      <div><div class="name">${esc(cl.name || 'Unknown')}</div><div class="sub">${esc(cl.email || '')}</div></div>
      <div class="sub">${esc(cl.book_title || '—')}</div>
      <div class="sub">${g.commissions.length} ${g.commissions.length === 1 ? 'job' : 'jobs'}</div>
      <div class="sub">$${esc(total)}</div>
      <div><span class="badge ${st}">${T_LABELS[st]}</span></div>`;
    const open = () => openClientPanel(g.id);
    row.addEventListener('click', open);
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    wrap.appendChild(row);
  });
}

function starsText(n) {

function fileDisplayName(path) { return String(path || '').split('/').pop().replace(/^\d{10,}-/, ''); }

function testimonialBlockHtml(c) {

async function ensureTestimonialRow(commissionId) {

function openClientPanel(clientId) {
  const g = getClientGroups().find(x => x.id === clientId);

  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  panel.classList.add('wide');

  const files = comms.flatMap(c => (c.commission_files || []).map(f => ({ ...f, _c: c })))
    .sort((a, b) => new Date(b.uploaded_at || 0) - new Date(a.uploaded_at || 0));
  const notes = comms.flatMap(c => (c.commission_notes || []).map(n => ({ ...n, _c: c })))
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const since = fmtDate(comms[comms.length - 1].created_at);

  panel.innerHTML = `
    <button class="close" id="closePanel" aria-label="Close panel">×</button>
    <h2>${esc(cl.name || 'Unknown')}</h2>
    <div class="panel-email"><a href="mailto:${esc(cl.email || '')}">${esc(cl.email || '')}</a></div>
    <div class="panel-head"><span class="badge delivered">Paid client</span><span class="link-status" style="margin:0;">Since ${since}</span></div>

    <div class="panel-section">
      <h3>Testimonial</h3>
      ${testimonialsReady ? '' : '<div class="setup-hint">Testimonials aren’t set up yet. Run the <code>20261001100000_testimonials.sql</code> migration in Supabase, then refresh.</div>'}
      <p class="link-status" style="margin:0 0 4px;">Sends the client a private link to rate their experience and write a testimonial. It appears on your homepage as soon as they submit.</p>
      ${comms.map(testimonialBlockHtml).join('')}
    </div>

    <div class="panel-section">
      <h3>Commissions (${comms.length})</h3>
      ${comms.map(c => {
        const quote = c.quotes?.[0], contract = c.contracts?.[0];
        return `<div class="mini-card">
          <div class="mc-title">${esc(labelFromType(c.commission_type))} <span class="badge ${esc(c.status)}" style="margin-left:6px;">${esc(c.status.replace('_', ' '))}</span></div>
          <div class="mc-sub">${esc(c.client?.book_title || '')}${c.slot ? ' · Week of ' + fmtDate(c.slot.slot_date) : ''}</div>
          <div class="kv"><span>Reference</span><span style="font-family:monospace;font-size:12px;color:var(--bronze-bright);user-select:all;">${esc(c.id)}</span></div>
          <div class="kv"><span>Total</span><span>$${esc(c.total_price ?? '—')} (paid in full)</span></div>
          <div style="margin-top:6px;"><a href="/site/track.html?cid=${esc(c.id)}&email=${encodeURIComponent(cl.email || '')}" target="_blank" style="font-size:12px;color:var(--bronze-bright);">Open Author Portal ↗</a></div>
          ${quote ? `<div class="kv"><span>Quote</span><span>${esc(quote.response)} · ${fmtDate(quote.sent_at)}</span></div>` : ''}
          ${contract ? `<div class="kv"><span>Contract</span><span>Signed by ${esc(contract.signature_name)} · ${fmtDate(contract.signed_at)}</span></div>` : ''}
          ${c.brief ? `<div class="brief-text">${esc(c.brief)}</div>` : ''}
          <div class="mini-actions"><button class="btn-ghost open-commission" data-cid="${esc(c.id)}">Open full commission</button></div>
        </div>`;
      }).join('')}
    </div>

    <div class="panel-section">
      <h3>Files (${files.length})</h3>
      <div id="clientFiles">
        ${files.map((f, i) => `<div class="file-row"><span>${esc(fileDisplayName(f.file_path))} <span style="color:var(--lilac-dim);">(${esc(f.file_type)} · ${esc(f.uploaded_by || 'artist')})</span></span><button class="btn-ghost f-dl" data-i="${i}">Download</button></div>`).join('')
          || '<p class="link-status" style="margin:0;">No files yet.</p>'}
      </div>
      <div style="margin-top:14px;">
        ${comms.length > 1 ? `<label for="cUploadFor">Add to commission</label><select id="cUploadFor" style="margin-bottom:8px;">${comms.map(c => `<option value="${esc(c.id)}">${esc(labelFromType(c.commission_type))} · ${fmtDate(c.created_at)}</option>`).join('')}</select>` : ''}
        <label for="cUploadType">Add a file</label>
        <select id="cUploadType" style="margin-bottom:8px;">
          <option value="reference">Reference</option><option value="sketch">Sketch</option>
          <option value="final_delivery">Final delivery</option><option value="other">Other</option>
        </select>
        <input type="file" id="cUploadInput">
        <button class="btn-ghost" id="cUploadBtn" style="margin-top:8px;">Upload</button>
        <div class="panel-msg" id="cUploadMsg" role="status" aria-live="polite"></div>
      </div>
    </div>

    <div class="panel-section">
      <h3>Notes (${notes.length})</h3>
      <div id="clientNotes">
        ${notes.map(n => `<div class="brief-text">${esc(n.note)}<div class="note-meta">${new Date(n.created_at).toLocaleString('en-GB')} — ${n.created_by === 'artist' ? 'You' : 'Client'}</div></div>`).join('')
          || '<p class="link-status" style="margin:0;">No notes yet.</p>'}
      </div>
      <div style="margin-top:14px;">
        <label for="cNoteInput">Add a private note</label>
        <textarea id="cNoteInput" rows="3" maxlength="5000" placeholder="e.g. Prefers warm palettes, wants a sequel cover in the spring."></textarea>
        ${comms.length > 1 ? `<select id="cNoteFor" style="margin-top:8px;" aria-label="Attach note to commission">${comms.map(c => `<option value="${esc(c.id)}">${esc(labelFromType(c.commission_type))} · ${fmtDate(c.created_at)}</option>`).join('')}</select>` : ''}
        <button class="btn-ghost" id="cNoteBtn" style="margin-top:8px;">Save note</button>
        <div class="panel-msg" id="cNoteMsg" role="status" aria-live="polite"></div>
      </div>
    </div>
  `;

  const reopen = async () => { await loadCommissions(); openClientPanel(clientId); };
  const flash = (el, kind, text) => { el.className = 'panel-msg ' + kind; el.textContent = text; };

  document.getElementById('closePanel').addEventListener('click', () => overlay.classList.remove('show'));
  overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('show'); };

  panel.querySelectorAll('.open-commission').forEach(b => b.addEventListener('click', () => {
    const c = allCommissions.find(x => x.id === b.dataset.cid); if (c) openPanel(c);
  }));

  panel.querySelectorAll('.t-send').forEach(btn => btn.addEventListener('click', async () => {
    const block = btn.closest('[data-block]');
    const msg = block.querySelector('.t-msg');
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Sending…';
    msg.className = 'panel-msg'; msg.innerHTML = '';
    const fail = (text) => { flash(msg, 'err', `Could not send — ${text}`); btn.disabled = false; btn.textContent = label; };

    const { data, error } = await sb.functions.invoke('send-testimonial-request', { body: { commission_id: btn.dataset.cid } });
    if (error) {
      let detail = error.message;
      try { const b = await error.context.json(); if (b?.error) detail = b.error; } catch (_) {}
      return fail(detail);
    }
    if (data?.error) return fail(data.error);

    if (data?.emailed) {
      flash(msg, 'ok', 'Testimonial request emailed to the client.');
    } else {
      msg.className = 'panel-msg warn';
      msg.innerHTML = `Link created but not emailed${data?.emailError ? ' (' + esc(data.emailError) + ')' : ''}. Copy it and send it yourself:
        <div class="copy-row"><input type="text" readonly value="${esc(data?.url || '')}" aria-label="Testimonial link"><button class="btn-ghost">Copy</button></div>`;
      const input = msg.querySelector('input');
      msg.querySelector('button').addEventListener('click', async (e) => {
        try { await navigator.clipboard.writeText(data.url); e.target.textContent = 'Copied'; } catch (_) { input.select(); }
      });
    }
    block.querySelector('.t-status').innerHTML = `<span class="link-status" style="margin:0;">Requested just now${data?.emailed ? ' (emailed)' : ' (link only)'} — waiting for the client.</span>`;
    btn.disabled = false; btn.textContent = 'Resend email';
    loadCommissions();
  }));

  panel.querySelectorAll('.t-copy').forEach(btn => btn.addEventListener('click', async () => {
    const msg = btn.closest('[data-block]').querySelector('.t-msg');
    try {
      const t = await ensureTestimonialRow(btn.dataset.cid);
      if (t.submitted_at) return flash(msg, 'warn', 'This client has already submitted a testimonial.');
      const url = testimonialLink(t);
      try { await navigator.clipboard.writeText(url); flash(msg, 'ok', 'Link copied. Send it to the client however you like.'); }
      catch (_) { msg.className = 'panel-msg warn'; msg.innerHTML = `Copy this link:<div class="copy-row"><input type="text" readonly value="${esc(url)}" aria-label="Testimonial link"></div>`; msg.querySelector('input').select(); }
      loadCommissions();
    } catch (e) { console.error(e); flash(msg, 'err', testimonialsReady ? 'Could not create the link.' : 'Run the testimonials migration first.'); }
  }));

  panel.querySelectorAll('.t-toggle').forEach(btn => btn.addEventListener('click', async () => {
    btn.disabled = true;
    const { error } = await sb.from('testimonials').update({ status: btn.dataset.next, updated_at: new Date().toISOString() }).eq('id', btn.dataset.tid);
    if (error) { console.error(error); btn.disabled = false; return; }
    reopen();
  }));

  panel.querySelectorAll('.f-dl').forEach(btn => btn.addEventListener('click', async () => {
    const f = files[Number(btn.dataset.i)];
    btn.disabled = true;
    const { data, error } = await sb.storage.from('commission-files').createSignedUrl(f.file_path, 300);
    btn.disabled = false;
    if (error || !data?.signedUrl) { console.error(error); btn.textContent = 'Failed'; return; }
    window.open(data.signedUrl, '_blank', 'noopener');
  }));

  document.getElementById('cUploadBtn').addEventListener('click', async () => {
    const input = document.getElementById('cUploadInput');
    const msg = document.getElementById('cUploadMsg');
    if (!input.files.length) return flash(msg, 'warn', 'Choose a file first.');
    const file = input.files[0];
    const cid = document.getElementById('cUploadFor')?.value || comms[0].id;
    const type = document.getElementById('cUploadType').value;
    const path = `${cid}/${Date.now()}-${file.name}`;
    const btn = document.getElementById('cUploadBtn');
    btn.disabled = true; btn.textContent = 'Uploading…';
    const { error: upErr } = await sb.storage.from('commission-files').upload(path, file);
    if (upErr) { console.error(upErr); btn.disabled = false; btn.textContent = 'Upload'; return flash(msg, 'err', 'Upload failed.'); }
    const { error: dbErr } = await sb.from('commission_files').insert({ commission_id: cid, file_path: path, file_type: type, uploaded_by: 'artist' });
    if (dbErr) { console.error(dbErr); btn.disabled = false; btn.textContent = 'Upload'; return flash(msg, 'err', 'File uploaded but could not be recorded.'); }
    reopen();
  });

  document.getElementById('cNoteBtn').addEventListener('click', async () => {
    const ta = document.getElementById('cNoteInput');
    const msg = document.getElementById('cNoteMsg');
    const note = ta.value.trim();
    if (!note) return flash(msg, 'warn', 'Write a note first.');
    const cid = document.getElementById('cNoteFor')?.value || comms[0].id;
    const btn = document.getElementById('cNoteBtn');
    btn.disabled = true;
    const { error } = await sb.from('commission_notes').insert({ commission_id: cid, note, created_by: 'artist' });
    if (error) { console.error(error); btn.disabled = false; return flash(msg, 'err', 'Could not save the note.'); }
    reopen();
  });

  overlay.classList.add('show');
}

// initial check
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) {
    document.getElementById('appView').style.display = 'block';
    renderSidebar();
    loadCommissions();
  } else {
    document.getElementById('authView').style.display = 'block';
  }
});
</script>
</body>
</html>
